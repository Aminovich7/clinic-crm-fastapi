{% extends "base.html" %}
{% block title %}Boshqa harajatlar — Klinika CRM{% endblock %}
{% block content %}
<h1>Boshqa harajatlar</h1>

<div id="error-container"></div>
<div id="success-container"></div>

<div class="card">
  <form class="inline-form" id="filter-form">
    <div class="field">
      <label for="search">Sarlavha bo'yicha qidirish</label>
      <input type="text" id="search">
    </div>
    <div class="field">
      <label for="date_from">Dan</label>
      <input type="date" id="date_from">
    </div>
    <div class="field">
      <label for="date_to">Gacha</label>
      <input type="date" id="date_to">
    </div>
    <button type="submit">Qidirish</button>
    <button type="button" class="secondary" id="current-month-btn">Joriy oy</button>
    <button type="button" class="secondary" id="previous-month-btn">O'tgan oy</button>
  </form>
  <p class="muted" id="period-label"></p>
</div>

<div class="grid" id="summary-cards"></div>

<div class="card entry-card">
  <h2>Xarajat qo'shish</h2>
  <form class="inline-form" id="expense-form">
    <div class="field">
      <label for="title">Sarlavha</label>
      <input type="text" id="title" required>
    </div>
    <div class="field">
      <label for="amount">Summa (so'm)</label>
      <input type="text" inputmode="numeric" id="amount" required>
    </div>
    <div class="field">
      <label for="date">Sana</label>
      <input type="date" id="date">
    </div>
    <button type="submit">Saqlash</button>
  </form>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Sana</th>
        <th>Sarlavha</th>
        <th class="num">Summa</th>
        <th>Amallar</th>
      </tr>
    </thead>
    <tbody id="expenses-tbody"></tbody>
  </table>
</div>

<div class="pagination" id="pagination"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/harajatlar.js?v={{ asset_version }}"></script>
{% endblock %}
