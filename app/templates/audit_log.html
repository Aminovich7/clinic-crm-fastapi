{% extends "base.html" %}
{% block title %}Audit jurnali — Klinika CRM{% endblock %}
{% block content %}
<h1>Audit jurnali</h1>

<div id="error-container"></div>

<div class="card">
  <form class="inline-form" id="filter-form">
    <div class="field">
      <label for="resource_type">Resurs turi</label>
      <input type="text" id="resource_type" placeholder="masalan: consultation">
    </div>
    <div class="field">
      <label for="resource_id">Resurs ID</label>
      <input type="text" id="resource_id">
    </div>
    <div class="field">
      <label for="date_from">Dan</label>
      <input type="date" id="date_from">
    </div>
    <div class="field">
      <label for="date_to">Gacha</label>
      <input type="date" id="date_to">
    </div>
    <button type="submit">Filtrlash</button>
  </form>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Vaqt</th>
        <th>Amal bajaruvchi</th>
        <th>Amal</th>
        <th>Resurs</th>
        <th>Resurs ID</th>
      </tr>
    </thead>
    <tbody id="audit-tbody"></tbody>
  </table>
</div>
<div class="pagination" id="pagination"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/audit_log.js?v={{ asset_version }}"></script>
{% endblock %}
