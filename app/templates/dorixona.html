{% extends "base.html" %}
{% block title %}Dorixona — Klinika CRM{% endblock %}
{% block content %}
<h1>Dorixona</h1>

<div id="error-container"></div>
<div id="success-container"></div>

<div class="card">
  <form class="inline-form" id="filter-form">
    <div class="field">
      <label for="date_from">Dan</label>
      <input type="date" id="date_from">
    </div>
    <div class="field">
      <label for="date_to">Gacha</label>
      <input type="date" id="date_to">
    </div>
    <button type="submit">Qidirish</button>
  </form>
</div>

<div class="grid" id="balance-cards"></div>

<div class="card">
  <h2>Yozuv qo'shish</h2>
  <form class="inline-form" id="entry-form">
    <div class="field">
      <label for="date">Sana</label>
      <input type="date" id="date">
    </div>
    <div class="field">
      <label for="medicine_cost">Olingan dori (so'm)</label>
      <input type="number" id="medicine_cost" min="0" step="1">
    </div>
    <div class="field">
      <label for="amount_paid">To'langan (so'm)</label>
      <input type="number" id="amount_paid" min="0" step="1">
    </div>
    <button type="submit">Saqlash</button>
  </form>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Sana</th>
        <th>Olingan dori</th>
        <th>To'langan</th>
        <th>Amallar</th>
      </tr>
    </thead>
    <tbody id="entries-tbody"></tbody>
  </table>
</div>

<div class="pagination" id="pagination"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/dorixona.js?v={{ asset_version }}"></script>
{% endblock %}
