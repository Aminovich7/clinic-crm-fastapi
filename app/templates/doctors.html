{% extends "base.html" %}
{% block title %}Shifokorlar — Klinika CRM{% endblock %}
{% block content %}
<h1>Shifokorlar</h1>

<div id="error-container"></div>
<div id="success-container"></div>

<div class="card">
  <form class="inline-form" id="search-form">
    <div class="field">
      <label for="search">Qidirish</label>
      <input type="text" id="search" placeholder="Ism yoki mutaxassislik">
    </div>
    <button type="submit">Qidirish</button>
  </form>
</div>

<div class="card hidden" id="form-card">
  <h2 id="form-title">Shifokor qo'shish</h2>
  <form class="inline-form" id="doctor-form">
    <input type="hidden" id="doctor-id">
    <div class="field">
      <label for="first_name">Ism</label>
      <input type="text" id="first_name" required>
    </div>
    <div class="field">
      <label for="last_name">Familiya</label>
      <input type="text" id="last_name" required>
    </div>
    <div class="field">
      <label for="specialty">Mutaxassislik</label>
      <input type="text" id="specialty" required>
    </div>
    <button type="submit" id="save-doctor-btn">Saqlash</button>
    <button type="button" class="secondary" id="cancel-form-btn">Bekor qilish</button>
  </form>
</div>

<button id="add-doctor-btn" class="hidden">+ Shifokor qo'shish</button>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Ism-familiya</th>
        <th>Mutaxassislik</th>
        <th>Amallar</th>
      </tr>
    </thead>
    <tbody id="doctors-tbody"></tbody>
  </table>
</div>

<div class="pagination" id="pagination"></div>
{% endblock %}
{% block scripts %}
<script src="/static/js/doctors.js"></script>
{% endblock %}
