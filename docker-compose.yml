services:
  web:
    build: .
    container_name: clinic-crm
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:18-alpine
    container_name: clinic-crm-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image:  redis:7-alpine
    container_name: clinic-crm-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
