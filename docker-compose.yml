# Local development stack. The bind mount and --reload below are what make
# this a dev file; a production deployment should drop both and put a TLS
# terminating reverse proxy in front of the web service.
services:
  web:
    build: .
    container_name: clinic-crm
    volumes:
      - .:/code
    # The reloader lives here rather than in the Dockerfile, so the image
    # itself stays production-safe. See the CMD note in the Dockerfile.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      # Bound to the loopback interface. Published as "8000:8000" this listens
      # on every interface, so on any machine with a routable address the app
      # is reachable from the network over plain HTTP.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:18-alpine
    container_name: clinic-crm-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only. "5432:5432" exposed the database to the whole network;
      # the web service reaches it over the compose network either way, so
      # this mapping exists purely for a local psql/GUI client.
      #
      # Host side is 55432 because this machine already runs a native Windows
      # PostgreSQL listening on 0.0.0.0:5432, which makes 127.0.0.1:5432
      # unbindable. Container-internal port is still 5432, so DATABASE_URL
      # ("db:5432") is unaffected — connect a local client to port 55432.
      - "127.0.0.1:55432:5432"

  redis:
    image: redis:7-alpine
    container_name: clinic-crm-redis
    # Redis had no password at all. It holds the JWT blocklist and the cached
    # token versions, so anyone who could reach it could un-revoke tokens from
    # sessions that had logged out, or lock users out by rewriting their
    # version. --requirepass closes that; REDIS_URL carries the same password.
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
